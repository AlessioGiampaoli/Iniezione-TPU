<style>
/* Layout: un percorso a tre passi (articolo, colore, ricetta) con grandi aree da toccare. La ricetta mette i chili in evidenza. */
:root{
  --bg:#EDF1F3;
  --surface:#FFFFFF;
  --surface-2:#F4F7F8;
  --ink:#14202A;
  --muted:#566673;
  --line:#D2DBE0;
  --accent:#0B6B66;
  --accent-ink:#FFFFFF;
  --accent-soft:#DCEEEC;
  --warn:#7A4A00;
  --warn-soft:#FFF0D2;
  --err:#B3261E;
  --err-soft:#FBE6E4;
  --focus:#1B6FD1;
  --font-display:'Barlow Condensed','Arial Narrow',sans-serif;
  --font-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1418;
    --surface:#141D23;
    --surface-2:#1A252C;
    --ink:#E4EBEF;
    --muted:#93A3AE;
    --line:#27353D;
    --accent:#4DC4B8;
    --accent-ink:#06211F;
    --accent-soft:#14312F;
    --warn:#FFC266;
    --warn-soft:#3A2A0E;
    --err:#FF8F86;
    --err-soft:#3A1D1B;
    --focus:#7DB4FF;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1418;
  --surface:#141D23;
  --surface-2:#1A252C;
  --ink:#E4EBEF;
  --muted:#93A3AE;
  --line:#27353D;
  --accent:#4DC4B8;
  --accent-ink:#06211F;
  --accent-soft:#14312F;
  --warn:#FFC266;
  --warn-soft:#3A2A0E;
  --err:#FF8F86;
  --err-soft:#3A1D1B;
  --focus:#7DB4FF;
  color-scheme:dark;
}

*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.5 var(--font-body);
  padding-block:16px 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.app{max-width:1000px;margin:0 auto}
.app>*{min-width:0}
h1,h2,h3{font-family:var(--font-display);font-weight:600;margin:0;text-wrap:balance}
p{margin:0}
a{color:inherit}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

.bar{display:flex;align-items:baseline;flex-wrap:wrap;gap:4px 12px;padding-bottom:12px;margin-bottom:20px;border-bottom:1px solid var(--line)}
.brand{font:600 22px/1 var(--font-display);text-transform:uppercase;letter-spacing:.05em;text-decoration:none;color:var(--ink)}
.bar-sub{color:var(--muted);font-size:14px}

.hero h1{font-size:clamp(32px,7vw,52px);line-height:1.02;text-transform:uppercase;letter-spacing:.01em}
.hero .sub{color:var(--muted);margin:6px 0 16px}
input[type="search"],input[type="text"],input[type="number"]{
  width:100%;min-height:56px;padding:0 16px;border:1.5px solid var(--line);border-radius:8px;
  background:var(--surface);color:var(--ink);font:18px var(--font-body);
}
input[type="search"]:focus,input[type="text"]:focus{border-color:var(--accent)}
.sec{font-size:22px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:24px 0 10px}
.count{color:var(--muted);font-size:14px;margin:16px 0 10px}

.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:10px}
.tile,.vt{
  display:flex;text-decoration:none;color:var(--ink);background:var(--surface);
  border:1px solid var(--line);border-radius:8px;min-width:0;
}
.tile{flex-direction:column;justify-content:center;gap:4px;min-height:88px;padding:14px 16px}
.tile:hover,.vt:hover{border-color:var(--accent)}
.t-name{font:600 24px/1.1 var(--font-display);text-transform:uppercase;letter-spacing:.02em;overflow-wrap:anywhere}
.t-meta{color:var(--muted);font-size:14px}

.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:10px;margin-top:14px}
.vt{align-items:center;gap:12px;min-height:68px;padding:10px 14px}
.vt-main{display:flex;flex-direction:column;min-width:0}
.vt-name{font-weight:600;font-size:18px;line-height:1.2;overflow-wrap:anywhere}
.vt-sub{color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.sw{flex:0 0 auto;width:24px;height:24px;border-radius:50%;border:1px solid var(--line);box-shadow:inset 0 0 0 2px var(--surface)}
.sw.none{background:var(--surface-2)}

.back{display:inline-flex;align-items:center;min-height:48px;color:var(--accent);font-weight:600;text-decoration:none;margin-bottom:4px}
.back:hover{text-decoration:underline}
.h-art{font-size:clamp(32px,7vw,52px);line-height:1.02;text-transform:uppercase}
.a-meta{color:var(--muted);margin:4px 0 14px}

.eyebrow{font:500 13px var(--font-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.rtitle{display:flex;align-items:center;flex-wrap:wrap;gap:6px 14px;font-size:clamp(38px,9vw,64px);line-height:1;text-transform:uppercase;margin:4px 0 16px}
.rtitle .sw{width:36px;height:36px}
.codechip{font:500 18px/1 var(--font-mono);letter-spacing:0;padding:6px 10px;border:1.5px solid var(--line);border-radius:6px;color:var(--muted)}

.calc{display:flex;align-items:center;flex-wrap:wrap;gap:10px 14px;padding:12px 16px;margin-bottom:16px;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.calc label{font-weight:600}
.calc input{width:130px;min-height:48px;font-size:20px}
.calc .hint{color:var(--muted);font-size:14px;flex:1 1 220px}

.part{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:16px}
.part-h{display:flex;align-items:center;flex-wrap:wrap;gap:8px 12px;padding:14px 16px}
.part-h h3{font-size:30px;text-transform:uppercase;letter-spacing:.02em}
.chip{font:500 12px/1 var(--font-mono);padding:5px 8px;border:1px solid var(--line);border-radius:4px;color:var(--muted);white-space:nowrap}
.master{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px 16px;padding:12px 16px;background:var(--accent-soft);border-top:1px solid var(--line)}
.m-label{font:500 11px var(--font-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.m-name{font-weight:600;font-size:20px;line-height:1.25;overflow-wrap:anywhere}
.m-pct{font:600 36px/1 var(--font-display);color:var(--accent)}
.alert{padding:12px 16px;background:var(--warn-soft);color:var(--warn);border-top:1px solid var(--line);font-size:15px}
.alert strong{display:block}
.alert ul{margin:6px 0 0;padding-left:20px}

.mrow{
  display:grid;grid-template-columns:minmax(0,1fr) 64px repeat(var(--n,1),minmax(104px,132px));
  gap:0 14px;align-items:center;padding:12px 16px;border-top:1px solid var(--line);
}
.mrow.head{padding-block:9px;font:500 11px/1.2 var(--font-mono);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);background:var(--surface-2)}
.mrow.master-row{background:var(--accent-soft)}
.mrow.total{background:var(--surface-2)}
.mname{font-weight:600;font-size:18px;line-height:1.25;overflow-wrap:anywhere}
.tag{display:inline-block;margin-left:8px;vertical-align:middle;font:500 11px/1 var(--font-mono);text-transform:uppercase;letter-spacing:.06em;padding:4px 6px;border:1px solid currentColor;border-radius:4px;color:var(--accent)}
.tag.add{color:var(--warn)}
.np,.nk{text-align:right;font-variant-numeric:tabular-nums}
.np .v{font-size:16px;color:var(--muted)}
.nk .v{font:600 30px/1 var(--font-display)}
.nk .u{margin-left:4px;font-size:13px;color:var(--muted)}
.nk .calc-tag{display:block;font:500 10px var(--font-mono);color:var(--warn);text-transform:uppercase}
.l{display:none}
.total .nk .v{font-size:26px}

.orig{border-top:1px solid var(--line);padding:0 16px}
.orig summary{display:flex;align-items:center;min-height:48px;cursor:pointer;color:var(--muted);font-size:14px}
.orig dl{margin:0 0 12px}
.orig dt{font:500 11px var(--font-mono);text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.orig dd{margin:2px 0 10px;font:13px/1.45 var(--font-mono);overflow-wrap:anywhere}
.none{padding:16px;color:var(--muted)}

.btn{
  display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 18px;border-radius:8px;
  border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);
  font:600 15px/1 var(--font-body);cursor:pointer;
}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.admin{margin-top:36px;border-top:1px solid var(--line);padding-top:8px}
.admin summary{display:flex;align-items:center;min-height:48px;cursor:pointer;color:var(--muted)}
.admin-body{display:flex;flex-direction:column;align-items:flex-start;gap:12px;padding:4px 0 8px;color:var(--muted);font-size:14px}
.admin-body p{max-width:60ch}
.admin-body .row{display:flex;flex-wrap:wrap;gap:10px}
.status{padding:10px 14px;border-radius:6px;background:var(--accent-soft);color:var(--ink);overflow-wrap:anywhere}
.status:empty{display:none}
.status.err{background:var(--err-soft);color:var(--err)}
.foot{margin-top:28px;color:var(--muted);font-size:13px}

@media (max-width:640px){
  .mrow{grid-template-columns:repeat(calc(var(--n,1) + 1),minmax(0,1fr));gap:8px 12px}
  .mrow.head{display:none}
  .mn{grid-column:1/-1}
  .np,.nk{text-align:left}
  .l{display:block;font:500 10.5px/1.2 var(--font-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:2px}
  .nk .v{font-size:28px}
  .m-pct{font-size:32px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

    var pol = m.filter(function(x){ return x.role === 'Polimero' && x.pct; });
    if (!pol.length) return;
    var P = pol.reduce(function(a, x){ return a + x.pct; }, 0);
    var T = 25 * P / pol[0].pct;
    m.forEach(function(x){
      if (x.kg == null && x.pct != null) {
        x.kg = round3(x.role === 'Polimero' ? T * x.pct / P : T * x.pct / 100);
        x.calc = true;
      }
    });
  }

  var SW = [['BIANCO','#F1F0EA'],['NERO','#1D1F22'],['GRIGIO','#8B939B'],['MARRONE','#6B4426'],['BEIGE','#D9C4A1'],
            ['AVORIO','#EEE5CC'],['VERDE','#52794D'],['BLU','#2F5D9B'],['AMBRA','#C9861A'],['MIELE','#C99A3B']];
  function swatchColor(grp){
    var texts = [grp.recs[0].master, grp.recs[0].miscela, grp.colore];
    for (var t = 0; t < texts.length; t++) {
      var s = String(texts[t]).toUpperCase();
      for (var i = 0; i < SW.length; i++) if (s.indexOf(SW[i][0]) > -1) return SW[i][1];
    }
    return '';
  }
  function swHtml(grp){
    var c = swatchColor(grp);
    return '<span class="sw' + (c ? '' : ' none') + '"' + (c ? ' style="background:' + c + '"' : '') + ' aria-hidden="true"></span>';
  }

  function build(R, M){
    var ri = colIdx(R.headers), mi = colIdx(M.headers);
    ['articolo', 'parte', 'colore'].forEach(function(k){
      if (ri[k] === undefined) throw new Error('nel foglio Ricette manca la colonna “' + k + '”.');
    });
    ['materiale', 'articolo', 'parte', 'colore'].forEach(function(k){
      if (mi[k] === undefined) throw new Error('nel foglio Materiali manca la colonna “' + k + '”.');
    });
    var mats = {};
    M.rows.forEach(function(r){
      var key = mkey(g(r, mi, 'Articolo'), g(r, mi, 'Parte'), g(r, mi, 'Colore'));
      (mats[key] = mats[key] || []).push({
        n: str(g(r, mi, 'Materiale')), role: str(g(r, mi, 'Ruolo')), pct: toNum(g(r, mi, '% in miscela')),
        kg: toNum(g(r, mi, 'Kg (base)')), kgm: toNum(g(r, mi, 'Kg per miscelatore'))
      });
    });
    var recs = [];
    R.rows.forEach(function(r){
      var art = str(g(r, ri, 'Articolo')), colore = str(g(r, ri, 'Colore'));
      if (!art && !colore) return;
      var rec = {
        art: art, colore: colore, stampo: str(g(r, ri, 'Codice stampo')),
        parte: str(g(r, ri, 'Parte')) || 'Suola', cod: str(g(r, ri, 'Cod. colore')),
        brand: str(g(r, ri, 'Marca master')), master: str(g(r, ri, 'Master')), mpct: toNum(g(r, ri, '% master')),
        miscela: str(g(r, ri, 'Miscela')), pesi: str(g(r, ri, 'Pesi (base)')), pesiMis: str(g(r, ri, 'Pesi per miscelatore')),
        anom: str(g(r, ri, 'Anomalie')).split(' | ').map(function(s){ return s.trim(); }).filter(Boolean),
        mats: (mats[mkey(art, g(r, ri, 'Parte'), colore)] || []).map(function(m){
          return {n:m.n, role:m.role, pct:m.pct, kg:m.kg, kgm:m.kgm};
        })
      };
      fillKg(rec);
      recs.push(rec);
    });
    if (!recs.length) throw new Error('nel foglio Ricette non ci sono righe.');

    var gm = {}, groups = [];
    recs.forEach(function(rec){
      var k = [rec.art, rec.colore, rec.cod].join('|').toLowerCase();
      var grp = gm[k];
      if (!grp) { grp = gm[k] = {art:rec.art, colore:rec.colore, cod:rec.cod, recs:[]}; groups.push(grp); }
      grp.recs.push(rec);
    });
    groups.sort(function(a, b){ return col.compare(a.art, b.art) || col.compare(a.colore, b.colore); });
    var am = {}, arts = [];
    groups.forEach(function(grp, i){
      grp.id = i;
      var a = am[grp.art];
      if (!a) { a = am[grp.art] = {name:grp.art, stampi:[], vars:[]}; arts.push(a); }
      a.vars.push(grp);
      grp.recs.forEach(function(r){ if (r.stampo && a.stampi.indexOf(r.stampo) === -1) a.stampi.push(r.stampo); });
      grp.artObj = a;
      grp.hay = [grp.art, grp.colore, grp.cod].concat(grp.recs.map(function(r){
        return [r.parte, r.master, r.brand, r.mats.map(function(x){ return x.n; }).join(' ')].join(' ');
      })).join(' ').toLowerCase();
    });
    arts.sort(function(a, b){ return col.compare(a.name, b.name); });
    arts.forEach(function(a, i){ a.id = i; });
    return {arts:arts, groups:groups, count:recs.length};
  }

  /* ---------- pezzi di pagina ---------- */
  function partsLine(grp){ return grp.recs.map(function(r){ return r.parte; }).join(' · '); }
  function vtile(grp, showArt){
    var sub = (showArt ? grp.art + ' · ' : '') + (grp.cod ? grp.cod + ' · ' : '') + partsLine(grp);
    return '<a class="vt" href="#v-' + grp.id + '">' + swHtml(grp) +
      '<span class="vt-main"><span class="vt-name">' + esc(grp.colore || 'Senza nome') + '</span>' +
      '<span class="vt-sub">' + esc(sub) + '</span></span></a>';
  }
  function tile(a){
    return '<a class="tile" href="#a-' + a.id + '"><span class="t-name">' + esc(a.name) + '</span>' +
      '<span class="t-meta">' + a.vars.length + (a.vars.length === 1 ? ' colore' : ' colori') +
      (a.stampi.length ? ' · Stampo ' + esc(a.stampi.join(', ')) : '') + '</span></a>';
  }
  function adminHtml(){
    return '<details class="admin"' + (msg.t ? ' open' : '') + '><summary>Aggiorna le ricette</summary><div class="admin-body">' +
      '<p>Carica un file Excel con i fogli <strong>Ricette</strong> e <strong>Materiali</strong>, come Miscelazione_TPU_per_presse.xlsx. ' +
      'Il file resta salvato solo su questo dispositivo.</p>' +
      '<div class="row"><label class="btn" for="file">Scegli file Excel</label>' +
      '<input class="sr" id="file" type="file" accept=".xlsx,.xls">' +
      (override ? '<button type="button" class="btn ghost" data-act="reset">Torna alle ricette incluse</button>' : '') + '</div>' +
      '<div class="status' + (msg.err ? ' err' : '') + '" role="status" aria-live="polite">' + esc(msg.t) + '</div></div></details>';
  }
  function renderFoot(){
    var src = override
      ? 'File caricato: ' + esc(override.name) + ' (' + new Date(override.added).toLocaleDateString('it-IT', {day:'numeric', month:'long', year:'numeric'}) + ')'
      : 'Fonte: documento MISCELAZIONE TPU PER PRESSE';
    $('#foot').innerHTML = src + ' · ' + model.count + ' ricette';
  }

  /* ---------- viste ---------- */
  function viewHome(){
    $('#main').innerHTML =
      '<section class="hero"><h1>Trova una ricetta</h1>' +
      '<p class="sub">Scegli un articolo oppure cerca per colore, codice o materiale.</p>' +
      '<label class="sr" for="q">Cerca</label>' +
      '<input id="q" type="search" placeholder="Articolo, colore, codice o materiale" autocomplete="off" value="' + esc(q) + '"></section>' +
      '<div id="hb"></div>' + adminHtml();
    homeBody();
  }
  function homeBody(){
    var el = $('#hb');
    var terms = q.toLowerCase().split(/\s+/).filter(Boolean);
    if (!terms.length) {
      el.innerHTML = '<h2 class="sec">Articoli</h2><div class="tiles">' + model.arts.map(tile).join('') + '</div>';
      return;
    }
    var res = model.groups.filter(function(grp){
      return terms.every(function(t){ return grp.hay.indexOf(t) > -1; });
    });
    if (!res.length) { el.innerHTML = '<p class="count">Nessuna ricetta trovata. Prova con meno parole.</p>'; return; }
    var cap = res.slice(0, 80);
    el.innerHTML = '<p class="count">' + res.length + (res.length === 1 ? ' ricetta trovata' : ' ricette trovate') +
      (res.length > cap.length ? ' (mostrate le prime 80)' : '') + '</p>' +
      '<div class="vgrid" style="margin-top:0">' + cap.map(function(grp){ return vtile(grp, true); }).join('') + '</div>';
  }

  function viewArticle(a){
    curArt = a;
    $('#main').innerHTML =
      '<a class="back" href="#home">← Tutti gli articoli</a>' +
      '<h1 class="h-art">' + esc(a.name) + '</h1>' +
      '<p class="a-meta">' + a.vars.length + (a.vars.length === 1 ? ' colore' : ' colori') +
      (a.stampi.length ? ' · Stampo ' + esc(a.stampi.join(', ')) : '') + '</p>' +
      (a.vars.length > 8
        ? '<label class="sr" for="cf">Filtra i colori</label><input id="cf" type="search" placeholder="Filtra i colori" autocomplete="off" value="' + esc(cf) + '">'
        : '') +
      '<div id="ab" class="vgrid"></div>';
    articleBody();
  }
  function articleBody(){
    var terms = cf.toLowerCase().split(/\s+/).filter(Boolean);
    var list = curArt.vars.filter(function(grp){
      var s = (grp.colore + ' ' + grp.cod).toLowerCase();
      return terms.every(function(t){ return s.indexOf(t) > -1; });
    });
    $('#ab').innerHTML = list.length ? list.map(function(grp){ return vtile(grp, false); }).join('')
      : '<p class="count">Nessun colore corrisponde.</p>';
  }

  function factor(m){
    var X = toNum(qty);
    if (!X || X <= 0 || !m.length || !m[0].kg) return null;
    return X / m[0].kg;
  }
  function sum(list){
    var t = 0;
    for (var i = 0; i < list.length; i++) { if (list[i] == null) return null; t += list[i]; }
    return round3(t);
  }
  function kgCell(label, v, calc){
    return '<div class="nk"><span class="l">' + label + '</span>' +
      (v == null ? '<span class="v">—</span>' : '<span class="v">' + num(v) + '</span><span class="u">kg</span>') +
      (calc && v != null ? '<span class="calc-tag">calcolato</span>' : '') + '</div>';
  }
  function partHtml(rec){
    var m = rec.mats, hasM = m.some(function(x){ return x.kgm != null; }), f = factor(m);
    var labels = ['Base'];
    if (hasM) labels.push('Miscelatore');
    if (f) labels.push('Richiesti');
    var h = '<section class="part"><div class="part-h"><h3>' + esc(rec.parte) + '</h3>' +
      (rec.stampo ? '<span class="chip">Stampo ' + esc(rec.stampo) + '</span>' : '') + '</div>';
    if (rec.master) {
      h += '<div class="master"><div><div class="m-label">Master</div><div class="m-name">' + esc(rec.master) + '</div></div>' +
        (rec.mpct != null ? '<div class="m-pct">' + nf.format(rec.mpct) + '%</div>' : '') + '</div>';
    }
    if (rec.anom.length) {
      h += '<div class="alert" role="note"><strong>Da verificare sul documento originale</strong><ul>' +
        rec.anom.map(function(x){ return '<li>' + esc(x) + '</li>'; }).join('') + '</ul></div>';
    }
    if (!m.length) {
      h += '<p class="none">I materiali di questa ricetta non sono disponibili.</p>';
    } else {
      h += '<div class="mats" style="--n:' + labels.length + '"><div class="mrow head"><div class="mn">Materiale</div><div class="np">%</div>' +
        labels.map(function(l){ return '<div class="nk">' + l + '</div>'; }).join('') + '</div>';
      m.forEach(function(x){
        var tag = x.role === 'Master' ? '<span class="tag">Master</span>' : (x.role === 'Additivo' ? '<span class="tag add">Additivo</span>' : '');
        h += '<div class="mrow' + (x.role === 'Master' ? ' master-row' : '') + '"><div class="mn"><span class="mname">' + esc(x.n) + '</span>' + tag + '</div>' +
          '<div class="np"><span class="l">Percentuale</span><span class="v">' + (x.pct == null ? '—' : nf.format(x.pct) + '%') + '</span></div>' +
          kgCell('Base', x.kg, x.calc) +
          (hasM ? kgCell('Miscelatore', x.kgm) : '') +
          (f ? kgCell('Richiesti', x.kg == null ? null : round3(x.kg * f)) : '') + '</div>';
      });
      h += '<div class="mrow total"><div class="mn"><span class="mname">Totale</span></div><div class="np"></div>' +
        kgCell('Base', sum(m.map(function(x){ return x.kg; }))) +
        (hasM ? kgCell('Miscelatore', sum(m.map(function(x){ return x.kgm; }))) : '') +
        (f ? kgCell('Richiesti', sum(m.map(function(x){ return x.kg == null ? null : x.kg * f; }))) : '') + '</div></div>';
    }
    h += '<details class="orig"><summary>Testo originale del documento</summary><dl>' +
      '<dt>Miscela</dt><dd>' + esc(rec.miscela) + '</dd>' +
      '<dt>Pesi</dt><dd>' + esc(rec.pesi) + '</dd>' +
      (rec.pesiMis ? '<dt>Pesi per miscelatore</dt><dd>' + esc(rec.pesiMis) + '</dd>' : '') + '</dl></details></section>';
    return h;
  }
  function viewVariant(grp){
    curVar = grp;
    $('#main').innerHTML =
      '<a class="back" href="#a-' + grp.artObj.id + '">← ' + esc(grp.art) + '</a>' +
      '<p class="eyebrow">' + esc(grp.art) + '</p>' +
      '<h1 class="rtitle">' + swHtml(grp) + '<span>' + esc(grp.colore || 'Senza nome') + '</span>' +
      (grp.cod ? '<span class="codechip">' + esc(grp.cod) + '</span>' : '') + '</h1>' +
      '<div class="calc"><label for="qty">Altra quantità</label>' +
      '<input id="qty" type="text" inputmode="decimal" placeholder="es. 40" autocomplete="off" value="' + esc(qty) + '">' +
      '<span class="hint">kg del primo materiale della ricetta. Gli altri pesi si ricalcolano.</span></div>' +
      '<div id="parts"></div>';
    partsBody();
  }
  function partsBody(){
    $('#parts').innerHTML = curVar.recs.map(partHtml).join('');
  }

  /* ---------- percorso ---------- */
  function render(){
    var h = location.hash.replace(/^#/, ''), m;
    if ((m = /^a-(\d+)$/.exec(h)) && model.arts[+m[1]]) viewArticle(model.arts[+m[1]]);
    else if ((m = /^v-(\d+)$/.exec(h)) && model.groups[+m[1]]) viewVariant(model.groups[+m[1]]);
    else viewHome();
    renderFoot();
  }
  function route(){
    var h = location.hash.replace(/^#/, '');
    if (h === lastKey) return;
    lastKey = h;
    cf = ''; qty = '';
    render();
    try { window.scrollTo(0, 0); } catch(e) {}
  }
  document.addEventListener('click', function(e){
    var a = e.target.closest('a[href^="#"]');
    if (a) { e.preventDefault(); location.hash = a.getAttribute('href').slice(1); route(); return; }
    var b = e.target.closest('[data-act="reset"]');
    if (b) {
      clearStored(); override = null; model = build(SEED.R, SEED.M);
      msg = {t:'Sono tornate le ricette incluse.', err:false}; q = ''; render();
    }
  });
  window.addEventListener('hashchange', route);

  document.addEventListener('input', function(e){
    var id = e.target.id;
    if (id === 'q') { q = e.target.value; homeBody(); }
    else if (id === 'cf') { cf = e.target.value; articleBody(); }
    else if (id === 'qty') { qty = e.target.value; partsBody(); }
  });

  /* ---------- aggiornamento da file ---------- */
  function table(wb, name){
    var key = null;
    wb.SheetNames.forEach(function(n){ if (!key && n.trim().toLowerCase() === name.toLowerCase()) key = n; });
    if (!key) return null;
    var aoa = XLSX.utils.sheet_to_json(wb.Sheets[key], {header:1, raw:true, defval:'', blankrows:false});
    if (aoa.length < 2) return null;
    return {headers: aoa[0].map(function(h){ return String(h).trim(); }), rows: aoa.slice(1)};
  }
  function importFile(f){
    if (typeof XLSX === 'undefined') {
      msg = {t:'La libreria di lettura non si è caricata. Ricarica la pagina.', err:true}; render(); return;
    }
    f.arrayBuffer().then(function(buf){
      var wb = XLSX.read(buf, {type:'array'});
      var R = table(wb, 'Ricette'), M = table(wb, 'Materiali');
      if (!R || !M) throw new Error('mancano i fogli “Ricette” e “Materiali”.');
      var nm = build(R, M);
      model = nm;
      override = {R:R, M:M, name:f.name, added:Date.now()};
      var ok = saveStored(override);
      msg = {t:'Caricato ' + f.name + ': ' + nm.count + ' ricette.' + (ok ? '' : ' Il file è troppo grande per essere ricordato su questo dispositivo.'), err:!ok};
      q = '';
      if (location.hash.replace(/^#/, '') !== 'home') { location.hash = 'home'; lastKey = 'home'; }
      render();
    }).catch(function(err){
      msg = {t:'File non letto: ' + (err && err.message ? err.message : 'formato non valido') , err:true};
      render();
    });
  }
  document.addEventListener('change', function(e){
    if (e.target.id === 'file' && e.target.files && e.target.files[0]) {
      var f = e.target.files[0];
      e.target.value = '';
      importFile(f);
    }
  });

  /* ---------- avvio ---------- */
  var stored = loadStored();
  if (stored) {
    try { model = build(stored.R, stored.M); override = stored; } catch(e) { model = null; }
  }
  if (!model) { model = build(SEED.R, SEED.M); override = null; }
  lastKey = location.hash.replace(/^#/, '');
  render();
})();
</script>

</body></html>
